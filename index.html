<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian Online System</title>
    <meta http-equiv="refresh" content="0; url=public/login.html">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f4f8;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
        }
        .loading {
            text-align: center;
            color: #6b7a8a;
        }
        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e9f0;
            border-top-color: #059669;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading a {
            color: #059669;
            text-decoration: none;
            font-weight: 600;
        }
        .loading a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <p>Mengarahkan ke halaman login...</p>
        <p><a href="public/login.html">Klik di sini</a> jika tidak otomatis redirect.</p>
    </div>
</body>
</html>
